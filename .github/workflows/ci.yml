name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc
            os: ubuntu-latest
          - name: linux-musl
            os: ubuntu-latest
            container: alpine:latest
          - name: macos
            os: macos-latest
    steps:
      # The GitHub-hosted images already provide cmake, a C compiler and make;
      # only the bare Alpine image needs anything installed.
      - name: Install dependencies
        if: matrix.container
        run: apk add --no-cache build-base cmake git
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Check install
        run: |
          cmake --install build --prefix "$PWD/stage"
          test -x stage/bin/lbzip2
          test -f stage/share/man/man1/lbzip2.1
          stage/bin/lbzip2 --version
