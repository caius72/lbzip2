name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      # sh rather than bash: the Alpine image ships neither bash nor the
      # automatic fallback that applies when no shell is named at all.
      run:
        shell: ${{ matrix.shell || 'sh' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc
            os: ubuntu-latest
          - name: linux-musl
            os: ubuntu-latest
            container: alpine:latest
          - name: macos
            os: macos-latest
          # lbzip2 needs fork(), sigaction(), futimens() and sysconf(), none of
          # which native Win32 provides, so this builds against the MSYS2
          # runtime rather than MinGW.  See kjn/lbzip2#16.
          - name: windows-msys
            os: windows-latest
            shell: 'msys2 {0}'
    steps:
      # The GitHub-hosted images already provide cmake, a C compiler and make;
      # only the bare Alpine image needs anything installed.
      - name: Install dependencies
        if: matrix.container
        run: apk add --no-cache build-base cmake git
      - name: Set up MSYS2
        if: matrix.name == 'windows-msys'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc cmake make
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Check install
        run: |
          cmake --install build --prefix "$PWD/stage"
          bin=stage/bin/lbzip2
          [ -x "$bin" ] || bin="$bin.exe"
          test -x "$bin"
          test -f stage/share/man/man1/lbzip2.1
          "$bin" --version
